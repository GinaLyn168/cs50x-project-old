<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/styles.css" type="text/css">
    <link href="static/icon.ico" rel="icon" type="image">
    <title>Shadow Girl!!</title>
</head>
<body>
    <h1>Shadow Girl</h1>

    <h4>Response:</h4>

    <img src="{{ url_for('static', filename=image_path) }}" alt="Emotion Image" width="400">

</body>
</html>
